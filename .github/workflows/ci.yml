name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
    branches: [trunk]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build

  codex-plugin:
    name: Codex Plugin Host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Install pinned Codex CLI
        run: npm install --prefix "${{ runner.temp }}/viewstor-codex-cli" --no-audit --no-fund @openai/codex@0.172.0
      - name: Verify Codex CLI version
        run: |
          VERSION="$("${{ runner.temp }}/viewstor-codex-cli/node_modules/.bin/codex" --version)"
          echo "$VERSION"
          test "$VERSION" = "codex-cli 0.172.0"
      - name: Run Codex plugin host smoke
        run: npm run test:codex-plugin
        env:
          CODEX_CLI: ${{ runner.temp }}/viewstor-codex-cli/node_modules/.bin/codex

  vscode-integration:
    name: VS Code Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Download VS Code for integration tests
        shell: bash
        run: |
          # Pin VS Code so better-sqlite3 prebuilds remain reproducible.
          EXECUTABLE=$(node -e '
            const { downloadAndUnzipVSCode, SilentReporter } = require("@vscode/test-electron");
            downloadAndUnzipVSCode({ version: "1.106.3", reporter: new SilentReporter() })
              .then(executable => console.log(executable))
              .catch(error => { console.error(error); process.exit(1); });
          ')
          echo "VIEWSTOR_VSCODE_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"
      - name: Run integration tests
        run: xvfb-run -a npm run test:vscode -- --fail-zero

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  changeset-size:
    name: Changeset Size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count changed files
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          COUNT=$(git diff --name-only "$BASE" "$HEAD" | wc -l)
          echo "Changed files: $COUNT"
          if [ "$COUNT" -ge 30 ]; then
            echo "::warning::Large changeset: $COUNT files changed. PRs with 30+ files have historically caused cascading regressions. Consider splitting."
          fi
